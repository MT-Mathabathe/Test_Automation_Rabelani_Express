name: Playwright Regression Tests
on:
  push:
    branches: [ main, initialise-project ]
  pull_request:
    branches: [ main, initialise-project ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
    
    - uses: actions/setup-node@v4.2.0
      with:
        node-version: lts/*
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      # We inject the cloud secrets into the temporary file layout before execution
      run: |
        mkdir -p config-environments
        echo "export default { BASE_URL: '${{ secrets.DEV_BASE_URL }}', TEST_USER_EMAIL: '${{ secrets.DEV_USER_EMAIL }}', TEST_USER_PASSWORD: '${{ secrets.DEV_USER_PASSWORD }}' };" > config-environments/dev.env.js
        npm run test:dev
        
    - uses: actions/upload-artifact@v4.6.1
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 3
